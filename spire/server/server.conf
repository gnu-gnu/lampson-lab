server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    socket_path = "/tmp/spire-server/private/api.sock"
    trust_domain = "lab"
    data_dir = "/opt/spire/data/server"
    log_level = "INFO"
    ca_key_type = "ec-p256"
    ca_ttl = "24h"
    default_x509_svid_ttl = "1h"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    # Keys on disk so a restarted server keeps its CA instead of minting a new one.
    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }

    # SPIRE's CA is signed by the lab intermediate, which chains to the fixed lab root.
    # step-ca trusts that same root for X5C, independent of SPIRE CA rotation (CONTRACT §3).
    UpstreamAuthority "disk" {
        plugin_data {
            cert_file_path = "/etc/spire/upstream/intermediate.crt"
            key_file_path = "/etc/spire/upstream/intermediate.key"
            bundle_file_path = "/etc/spire/upstream/bundle.crt"
        }
    }
}
